name: TajVid Android Release

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Restore Firebase config
        run: |
          printf '%s' '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare release keystore
        run: |
          echo "${{ secrets.TAJVID_KEYSTORE_BASE64 }}" | base64 --decode > android/tajvid-release.jks

      - name: Build signed release APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -PTAJVID_STORE_FILE=tajvid-release.jks \
            -PTAJVID_STORE_PASSWORD="${{ secrets.TAJVID_STORE_PASSWORD }}" \
            -PTAJVID_KEY_ALIAS="${{ secrets.TAJVID_KEY_ALIAS }}" \
            -PTAJVID_KEY_PASSWORD="${{ secrets.TAJVID_KEY_PASSWORD }}"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TajVid-signed-release
          path: android/app/build/outputs/apk/release/app-release.apk
